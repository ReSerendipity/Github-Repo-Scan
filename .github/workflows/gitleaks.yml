name: Secret Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周日 01:00 UTC 全量历史扫描
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  # gitleaks 版本升级维护：只改这一处（与本地 gitleaks --version 保持一致）
  GITLEAKS_VERSION: '8.30.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v4 tag 指向 SHA（2026-10-11 抓取，R2 P2-7 供应链锁定）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # 直接运行官方 CLI 二进制（无需 GITLEAKS_LICENSE，版本由 env 集中管理）
      # R2 P2-7：下载后按固定 SHA256 校验（值抓取自 v8.30.1 release 资产，2026-10-11 实测）
      - name: Run gitleaks scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          # --redact 保证报告不输出真实密钥；发现泄露时 gitleaks 以非零码退出，流程失败即门禁
          ./gitleaks detect --source . --redact --config gitleaks.toml \
            --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        # actions/upload-artifact@v4 tag 指向 SHA（2026-10-11 抓取，R2 P2-7 供应链锁定）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
